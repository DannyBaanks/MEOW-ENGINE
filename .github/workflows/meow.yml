name: 🐱 MEOW CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 12 * * *'  # Daily at noon (cat feeding time)

jobs:
  test-and-meow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: 🧪 Run tests (the joke)
        run: |
          python -m pytest tests/ -v --tb=short

      - name: 🐱 Generate cat for README
        id: meow
        run: |
          python -c "
import random, sys
cats = [
    '''      |\\      _,,,---,,_
ZZZzz /,`.-'`'    -.  ;-;;,_
     |,4-  ) )-,_. ,\ (  '-' 
    '---''(_/--'  \`-'\\_)''',
    '''      |\\      _,,,---,,_
ZZZzz /,`.-'`'    -.  ;-;;,_
     |,4-  ) )-,_. ,\ (  '-' 
    '---''(_/--'  \\_-')''',
    '''      |\\      _,,,---,,_
ZZZzz /,`.-'`'    -.  ;-;;,_
     |,4-  ) )-,_. ,\ (  '-' 
    '---''(_/--'  \\_\\')''',
    '''      |
   / \\__
  (    @\\___
  /         O
 /   (_____/
/_____/   U''',
    '''      |
    \\   /
     |  |
    /   \\
   |     |
   |  .  |
    \\___/
    ___|___'''
]
print(cats[random.randrange(len(cats))])
" > cat.txt
          cat cat.txt
          echo "meow<<EOF" >> $GITHUB_OUTPUT
          cat cat.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📝 Update README with cat
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          CAT=$(cat cat.txt)
          cat > README.md <<'EOF'
# MEOW-ENGINE

El gato más innecesariamente sobre-ingenierizado del mundo.

> **¿Por qué?** Podíamos. · **¿Qué hace?** Hace un gato. · **¿40 lenguajes?** Sí.

    python meow.py --tournament

## La gracia

    python -m pytest tests/test_the_joke.py::test_the_whole_thing_was_unnecessary

El coliseo entero produce exactamente lo mismo que JAJAJA solo.
Todo el proyecto existe para demostrar que todo el proyecto era innecesario.

---

### Gatito del día 🐱

\`\`\`
${CAT}
\`\`\`

*Actualizado automáticamente por CI • $(date -u +"%Y-%m-%d %H:%M UTC")*

---

## En Honor a todos mis gatitas/os 🐱❤️
EOF

      - name: 📤 Commit README if changed
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "🐱 Actualiza gatito del día $(date -u +'%Y-%m-%d')" && git push)

  meow-only:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🐱 Daily meow
        run: |
          echo "🐱 Daily scheduled meow - keeping the repo purring"